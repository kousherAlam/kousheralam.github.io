# Build, version (via Changesets), tag/release, and deploy the Astro site to GitHub Pages.
#
# On every push to master this workflow:
#   1. Consumes any pending changesets -> bumps package.json + CHANGELOG (minor/patch/major)
#   2. Ensures the current version has a `vX.Y.Z` git tag + GitHub Release (floor: v1.0.0)
#   3. Builds the site and deploys to GitHub Pages
#
# Doing everything in one run avoids cross-workflow trigger races. The version-bump commit
# is pushed back with GITHUB_TOKEN, which by design does NOT re-trigger workflows.
name: Deploy Astro site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "." # default value when not using subfolders

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for versioning/tagging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Consume changesets (version bump)
        run: |
          shopt -s nullglob
          pending=()
          for f in .changeset/*.md; do
            [ "$(basename "$f")" = "README.md" ] && continue
            pending+=("$f")
          done
          if [ ${#pending[@]} -gt 0 ]; then
            echo "Found ${#pending[@]} pending changeset(s); running changeset version..."
            npx changeset version
            git add -A
            git commit -m "chore: release [skip ci]" || echo "Nothing to commit."
          else
            echo "No pending changesets; version unchanged."
          fi

      - name: Read package version
        id: version
        run: echo "value=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Push release commit & create tag/release if new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          # Push any version-bump commit back to master (no-op if nothing changed).
          git push origin HEAD:master || true
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists; skipping tag/release."
          else
            echo "Creating tag and release $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" --title "$TAG" \
              --notes "Automated release $TAG. See CHANGELOG.md for details." \
              || echo "Release may already exist; continuing."
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set Package Version as Env Variable
        run: echo "PACKAGE_VERSION=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      - name: Build with Astro
        run: |
          npx astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: gh-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
